name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build release
        run: swift build -c release

      - name: Assemble app bundle
        run: |
          mkdir -p AgentTerms.app/Contents/MacOS
          mkdir -p AgentTerms.app/Contents/Resources
          cp .build/arm64-apple-macosx/release/AgentTerms AgentTerms.app/Contents/MacOS/AgentTerms
          cp -R .build/arm64-apple-macosx/release/AgentTerms_AgentTerms.bundle AgentTerms.app/Contents/MacOS/AgentTerms_AgentTerms.bundle
          cp -R .build/arm64-apple-macosx/release/AgentTerms_AgentTerms.bundle AgentTerms.app/Contents/Resources/AgentTerms_AgentTerms.bundle
          cat > AgentTerms.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AgentTerms</string>
              <key>CFBundleIdentifier</key>
              <string>com.agentterms.app</string>
              <key>CFBundleName</key>
              <string>AgentTerms</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -R AgentTerms.app dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "AgentTerms" -srcfolder dmg_contents -ov -format UDZO AgentTerms.dmg

      - name: Create zip
        run: |
          zip -r AgentTerms-macOS.zip AgentTerms.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AgentTerms.dmg
            AgentTerms-macOS.zip
          generate_release_notes: true
